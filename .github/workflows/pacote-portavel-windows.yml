# Gera sob demanda um pacote portável (.zip) do Wave Studio para Windows x64,
# com checksum SHA-256, sem alterar o fluxo principal de testes em PRs.
name: Pacote portável Windows x64

on:
  workflow_dispatch:
    inputs:
      self_contained:
        description: 'Incluir o runtime .NET 10 no pacote (dispensa instalar .NET na máquina de teste)'
        type: boolean
        default: true

permissions:
  contents: read

# Cada execução manual mantém seu próprio grupo para não cancelar pacotes em andamento.
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  empacotar:
    name: Empacotar Windows x64
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Confirmar arquitetura e SDK
        shell: pwsh
        run: |
          if ($env:RUNNER_ARCH -ne 'X64' -or [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture -ne 'X64') {
            throw 'O empacotamento exige runner e processo Windows x64.'
          }
          dotnet --info

      - name: Restaurar e auditar dependências com lockfile
        run: dotnet restore WaveStudio.slnx --locked-mode -p:NuGetAudit=true -p:NuGetAuditMode=all -p:WarningsAsErrors=NU1900

      - name: Validar build Release sem avisos
        run: dotnet build WaveStudio.slnx -c Release --no-restore --no-incremental -warnaserror --nologo

      - name: Publicar pacote portável Windows x64
        shell: pwsh
        run: |
          $selfContained = '${{ inputs.self_contained }}'
          $publishDir = Join-Path $env:RUNNER_TEMP 'wavestudio-publish'
          New-Item -ItemType Directory -Path $publishDir -Force | Out-Null

          # Desabilita apenas neste comando a checagem de lockfile por RID para permitir
          # resolver o runtime pack win-x64 sem modificar os packages.lock.json versionados.
          dotnet publish src/WaveStudio.Desktop/WaveStudio.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained $selfContained `
            -p:RestorePackagesWithLockFile=false `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o "$publishDir" `
            --nologo

      - name: Compactar ZIP e gerar SHA-256
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'wavestudio-publish'
          $outDir = Join-Path $env:RUNNER_TEMP 'wavestudio-release'
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null

          $modo = if ('${{ inputs.self_contained }}' -eq 'true') { 'self-contained' } else { 'framework-dependent' }
          $shaCurto = $env:GITHUB_SHA.Substring(0, 7)
          $zipNome = "WaveStudio-win-x64-$modo-$shaCurto.zip"
          $zipPath = Join-Path $outDir $zipNome

          Compress-Archive -Path (Join-Path $publishDir '*') -DestinationPath $zipPath -CompressionLevel Optimal
          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zipNome" | Set-Content -Path (Join-Path $outDir 'SHA256SUMS.txt') -Encoding utf8NoBOM
          Get-ChildItem -Path $outDir | Format-Table Name, Length -AutoSize

      - name: Publicar artefato do pacote portável
        uses: actions/upload-artifact@v4
        with:
          name: wavestudio-portavel-win-x64
          path: ${{ runner.temp }}/wavestudio-release/*
          retention-days: 14
          if-no-files-found: error